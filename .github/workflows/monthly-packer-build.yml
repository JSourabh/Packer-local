name: Monthly Packer Docker Build

on:
  # Trigger manually from GitHub Actions UI anytime
  workflow_dispatch:

  # Auto-trigger: 1st day of every month at 02:00 UTC
  schedule:
    - cron: '0 2 1 * *'

jobs:
  packer-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # needed to push to GHCR

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/packer-webserver
      IMAGE_TAG:  ${{ github.run_number }}

    steps:

      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      # -------------------------------------------------------
      - name: Set up HashiCorp Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      # -------------------------------------------------------
      - name: Initialize Packer plugins
        working-directory: ./packer
        run: packer init .

      # -------------------------------------------------------
      - name: Format-check Packer template
        working-directory: ./packer
        run: packer fmt -check docker-webserver.pkr.hcl

      # -------------------------------------------------------
      - name: Validate Packer template
        working-directory: ./packer
        run: |
          packer validate \
            -var "image_name=${{ env.IMAGE_NAME }}" \
            -var "image_tag=${{ env.IMAGE_TAG }}" \
            -var "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker-webserver.pkr.hcl

      # -------------------------------------------------------
      - name: Build Docker image with Packer
        working-directory: ./packer
        run: |
          packer build \
            -var "image_name=${{ env.IMAGE_NAME }}" \
            -var "image_tag=${{ env.IMAGE_TAG }}" \
            -var "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker-webserver.pkr.hcl

      # -------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      - name: Push versioned and latest tags to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # -------------------------------------------------------
      - name: Run smoke tests against built image
        run: |
          docker run -d --name packer-ci-test -p 8080:80 ${{ env.IMAGE_NAME }}:latest
          sleep 8
          curl -fsS http://127.0.0.1:8080 | grep -q "Packer-built"
          docker exec packer-ci-test python3 --version
          docker exec packer-ci-test apache2ctl configtest
          docker rm -f packer-ci-test
          echo "CI smoke tests passed"

      # -------------------------------------------------------
      - name: Print image summary
        run: |
          echo "Image built and pushed:"
          echo "  ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "  ${{ env.IMAGE_NAME }}:latest"

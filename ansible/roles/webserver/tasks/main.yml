---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Apache, Python and utilities
  ansible.builtin.apt:
    name:
      - apache2
      - python3
      - python3-pip
      - python3-venv
      - curl
      - vim
      - ca-certificates
      - net-tools
    state: present

- name: Enable required Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  loop:
    - headers
    - rewrite
    - ssl
  changed_when: true
  notify: Restart apache

- name: Copy Apache virtual host configuration
  ansible.builtin.template:
    src: 000-default.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart apache

- name: Copy hardened Apache security config
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/apache2/conf-available/security-custom.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart apache

- name: Enable custom Apache security config
  ansible.builtin.command: a2enconf security-custom
  changed_when: true
  notify: Restart apache

- name: Deploy custom index.html page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Install Python application packages via pip
  ansible.builtin.pip:
    name:
      - flask
      - requests
      - gunicorn
    executable: pip3

- name: Create app directory
  ansible.builtin.file:
    path: /var/www/app
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Ensure Apache service is enabled
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: started
